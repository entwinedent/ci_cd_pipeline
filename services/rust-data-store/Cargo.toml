[package]
name = "rust-data-store"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
dashmap = "5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
indexmap = "2.2"
getrandom = "0.2"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
tonic = "0.11"
prost = "0.12"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.11"
