[package]
name = "rust-data-store"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
dashmap = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
indexmap = "2.2"
getrandom = "0.4"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors"] }
tonic = "0.14"
prost = "0.14"
tokio-stream = "0.1"

[build-dependencies]
tonic-build = "0.14"
