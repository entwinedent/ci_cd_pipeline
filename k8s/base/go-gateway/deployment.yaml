apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-gateway
  labels:
    app: go-api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api-gateway
  template:
    metadata:
      labels:
        app: go-api-gateway
        version: v1
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/username/ci-cd-pipeline/go-api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: DATA_STORE_TARGET
          value: "rust-data-store:50051"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
