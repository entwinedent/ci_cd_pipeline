apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-gateway-high-compute
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-api-gateway-high-compute
  template:
    metadata:
      labels:
        app: go-api-gateway-high-compute
    spec:
      containers:
      - name: go-api-gateway
        image: go-api-gateway:latest
        resources:
          requests:
            cpu: "4"  # High compute request
            memory: "8Gi"
          limits:
            cpu: "8"  # High compute limit
            memory: "16Gi"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: go-api-gateway-high-compute
  namespace: default
spec:
  selector:
    app: go-api-gateway-high-compute
  ports:
  - port: 8080
    targetPort: 8080
