apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rust-data-store
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/username/ci-cd-pipeline.git
    targetRevision: HEAD
    path: k8s/base/rust-store
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
