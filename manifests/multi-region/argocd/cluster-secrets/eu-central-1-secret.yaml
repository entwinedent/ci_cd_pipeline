# Argo CD Cluster Secret for eu-central-1 EKS Cluster
# This secret allows Argo CD to manage the secondary region cluster

apiVersion: v1
kind: Secret
metadata:
  name: region-eu-central-1
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: region-eu-central-1
  server: https://gr7.eu-central-1.eks.amazonaws.com
  config: |
    {
      "awsAuthConfig": {
        "clusterName": "ci-cd-pipeline-secondary",
        "roleARN": "arn:aws:iam::ACCOUNT_ID:role/argocd-cluster-role"
      },
      "tlsClientConfig": {
        "insecure": false,
        "caData": "BASE64_ENCODED_CA_CERT"
      }
    }
