# SPIRE Server Federation Configuration
# Enables cross-region identity federation between us-east-1 and eu-central-1

apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterFederation
metadata:
  name: multi-region-federation
  namespace: spire
spec:
  trustDomain: ci-cd-pipeline.local
  
  # Primary region (us-east-1) SPIRE server
  primary:
    trustDomain: ci-cd-pipeline.local
    bundleEndpoint: https://spire-server.spire.svc:8443
    endpointSocket: spire-server.spire.svc:8081
    
  # Secondary region (eu-central-1) SPIRE server
  secondary:
    trustDomain: ci-cd-pipeline.local
    bundleEndpoint: https://spire-server.spire.svc:8443
    endpointSocket: spire-server.spire.svc:8081
    
  # Federation mode
  mode: bidirectional
  
  # Trust bundle synchronization
  syncPolicy:
    interval: 30s
    retryInterval: 5s
    retryLimit: 3
    
  # Bundle refresh settings
  bundleRefresh:
    interval: 1h
    jitter: 10m
    
  # Federation endpoints
  federationEndpoints:
    - name: us-east-1
      trustDomain: ci-cd-pipeline.local
      bundleEndpoint: https://spire-server-us-east-1.spire.svc:8443
      endpointSocket: spire-server-us-east-1.spire.svc:8081
      trustDomainBundle:
        trustDomain: ci-cd-pipeline.local
        bundleEndpoint: https://spire-server-us-east-1.spire.svc:8443
        endpointSocket: spire-server-us-east-1.spire.svc:8081
        
    - name: eu-central-1
      trustDomain: ci-cd-pipeline.local
      bundleEndpoint: https://spire-server-eu-central-1.spire.svc:8443
      endpointSocket: spire-server-eu-central-1.spire.svc:8081
      trustDomainBundle:
        trustDomain: ci-cd-pipeline.local
        bundleEndpoint: https://spire-server-eu-central-1.spire.svc:8443
        endpointSocket: spire-server-eu-central-1.spire.svc:8081
---
