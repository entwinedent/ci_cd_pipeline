apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencost
  namespace: opencost
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opencost
rules:
- apiGroups: [""]
  resources: ["pods", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opencost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opencost
subjects:
- kind: ServiceAccount
  name: opencost
  namespace: opencost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencost
  namespace: opencost
  labels:
    app: opencost
    app.kubernetes.io/name: opencost
    app.kubernetes.io/component: finops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencost
  template:
    metadata:
      labels:
        app: opencost
        app.kubernetes.io/name: opencost
        app.kubernetes.io/component: finops
    spec:
      serviceAccountName: opencost
      containers:
      - name: opencost
        image: ghcr.io/opencost/opencost:v1.108.0
        ports:
        - containerPort: 9003
          name: http
        - containerPort: 9004
          name: prometheus
        env:
        - name: CLOUD_PROVIDER_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencost-secret
              key: cloud-provider-api-key
              optional: true
        - name: PROMETHEUS_ENDPOINT
          value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
        - name: CLUSTER_ID
          value: "ci-cd-pipeline-cluster"
        - name: CLUSTER_NAME
          value: "ci-cd-pipeline"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 9003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 9003
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: opencost
  namespace: opencost
  labels:
    app: opencost
    app.kubernetes.io/name: opencost
spec:
  selector:
    app: opencost
  ports:
  - name: http
    port: 9003
    targetPort: 9003
  - name: prometheus
    port: 9004
    targetPort: 9004
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencost-pricing
  namespace: opencost
data:
  pricing.json: |
    {
      "CPU": "0.0316",
      "SpotCPU": "0.0066",
      "RAM": "0.00423",
      "SpotRAM": "0.000846",
      "GPU": "0.95",
      "Storage": "0.0001",
      "ZoneNetworkEgress": "0.01",
      "RegionNetworkEgress": "0.01",
      "InternetNetworkEgress": "0.12"
    }
