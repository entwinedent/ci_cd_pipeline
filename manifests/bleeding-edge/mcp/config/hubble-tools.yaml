apiVersion: v1
kind: ConfigMap
metadata:
  name: hubble-tools
  namespace: mcp-server
data:
  tools.yaml: |
    - name: get_hubble_flows
      description: Get network flows from Hubble
      input_schema:
        type: object
        properties:
          namespace:
            type: string
            description: Kubernetes namespace
          duration:
            type: string
            description: Time duration for flows (e.g., 5m)
          filter:
            type: string
            description: Flow filter expression
      operation: read
    
    - name: get_hubble_metrics
      description: Get Hubble network metrics
      input_schema:
        type: object
        properties:
          metric:
            type: string
            description: Metric name (drop, tcp, flow, http, dns)
          duration:
            type: string
            description: Time duration (e.g., 5m)
      operation: read
