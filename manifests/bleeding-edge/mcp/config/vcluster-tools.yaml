apiVersion: v1
kind: ConfigMap
metadata:
  name: vcluster-tools
  namespace: mcp-server
data:
  tools.yaml: |
    - name: list_vclusters
      description: List vCluster instances
      input_schema:
        type: object
        properties: {}
      operation: read
    
    - name: create_vcluster
      description: Create a new vCluster
      input_schema:
        type: object
        properties:
          name:
            type: string
            description: vCluster name
          namespace:
            type: string
            description: Target namespace
          context:
            type: string
            description: Kubernetes context
      operation: write
    
    - name: delete_vcluster
      description: Delete a vCluster
      input_schema:
        type: object
        properties:
          name:
            type: string
            description: vCluster name
          namespace:
            type: string
            description: Target namespace
      operation: write
    
    - name: connect_vcluster
      description: Connect to a vCluster
      input_schema:
        type: object
        properties:
          name:
            type: string
            description: vCluster name
          namespace:
            type: string
            description: Target namespace
      operation: read
