apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/data"
      log_level = "INFO"
      server_address = "spire-server.spire.svc.cluster.local"
      server_port = 8081
      socket_path = "/run/spire/sockets/agent.sock"
      trust_domain = "ci-cd-pipeline.local"
      
      plugins {
        NodeAttestor = "k8s"
        KeyManager = "disk"
        WorkloadAttestor = "k8s"
      }
      
      # SVID configuration
      svid {
        svid_ttl = "1h"
        svid_refresh = true
      }
      
      # Workload API
      workload_api {
        socket_path = "/run/spire/sockets/workload_api.sock"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      containers:
      - name: spire-agent
        image: ghcr.io/spiffe/spire-agent:1.8.0
        imagePullPolicy: IfNotPresent
        args:
        - "-config"
        - "/etc/spire/agent.conf"
        ports:
        - containerPort: 8081
          name: grpc
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/spire
        - name: data
          mountPath: /run/spire/data
        - name: sockets
          mountPath: /run/spire/sockets
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: spire-agent
      - name: data
        emptyDir: {}
      - name: sockets
        emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-agent
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-agent
subjects:
- kind: ServiceAccount
  name: spire-agent
  namespace: spire
