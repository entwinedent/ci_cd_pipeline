apiVersion: apps/v1
kind: Deployment
metadata:
  name: unleash
  namespace: unleash
  labels:
    app: unleash
    app.kubernetes.io/name: unleash
    app.kubernetes.io/component: feature-flags
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unleash
  template:
    metadata:
      labels:
        app: unleash
        app.kubernetes.io/name: unleash
        app.kubernetes.io/component: feature-flags
    spec:
      containers:
      - name: unleash
        image: unleashorg/unleash-server:5.5.0
        ports:
        - containerPort: 4242
        env:
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: unleash-config
              key: DATABASE_URL
        - name: DATABASE_SSL
          valueFrom:
            configMapKeyRef:
              name: unleash-config
              key: DATABASE_SSL
        - name: INIT_ADMIN_API_TOKENS
          valueFrom:
            configMapKeyRef:
              name: unleash-config
              key: INIT_ADMIN_API_TOKENS
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: unleash-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4242
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4242
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: unleash
  namespace: unleash
  labels:
    app: unleash
    app.kubernetes.io/name: unleash
spec:
  selector:
    app: unleash
  ports:
  - name: http
    port: 4242
    targetPort: 4242
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unleash-ingress
  namespace: unleash
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: unleash.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: unleash
            port:
              number: 4242
