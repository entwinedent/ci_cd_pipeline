apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: required-labels
  annotations:
    policies.kyverno.io/title: Require Standard Labels
    policies.kyverno.io/category: Standards
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod, Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/description: >-
      All workloads must have standard labels for proper organization and tracking.
      Required labels: app, version, environment
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: check-pod-labels
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Pods must have labels: app, version, and environment"
      pattern:
        metadata:
          labels:
            app: "?*"
            version: "?*"
            environment: "?*"
  - name: check-deployment-labels
    match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          - DaemonSet
    validate:
      message: "Workloads must have labels: app, version, and environment"
      pattern:
        metadata:
          labels:
            app: "?*"
            version: "?*"
            environment: "?*"
