apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      All containers must specify resource requests and limits to prevent
      resource starvation and ensure fair resource allocation.
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: require-resource-requests
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Containers must specify resource requests (cpu and memory)"
      pattern:
        spec:
          containers:
          - resources:
              requests:
                cpu: "?*"
                memory: "?*"
  - name: require-resource-limits
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Containers must specify resource limits (cpu and memory)"
      pattern:
        spec:
          containers:
          - resources:
              limits:
                cpu: "?*"
                memory: "?*"
