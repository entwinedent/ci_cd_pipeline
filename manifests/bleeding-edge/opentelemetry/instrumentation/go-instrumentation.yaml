apiVersion: v1
kind: ConfigMap
metadata:
  name: go-otel-config
  namespace: default
data:
  otel-config.yaml: |
    exporters:
      otlp:
        endpoint: localhost:4317
        tls:
          insecure: true
    
    processors:
      batch:
        timeout: 1s
    
    service:
      pipelines:
        traces:
          exporters: [otlp]
          processors: [batch]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-env-config
  namespace: default
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "localhost:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_SERVICE_NAME: "go-api-gateway"
  OTEL_RESOURCE_ATTRIBUTES: "service.name=go-api-gateway,service.version=latest,deployment.environment=production"
  OTEL_TRACES_SAMPLER: "always_on"
  OTEL_TRACES_EXPORTER: "otlp"
