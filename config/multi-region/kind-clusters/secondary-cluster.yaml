# Kind Cluster Configuration for Secondary Region Simulation
# Simulates eu-central-1 EKS cluster locally

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci-cd-pipeline-secondary
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 9080
        protocol: TCP
      - containerPort: 443
        hostPort: 9443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.28.0
  - role: worker
    image: kindest/node:v1.28.0
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 7443
  podSubnet: "10.2.0.0/16"
  serviceSubnet: "10.3.0.0/16"
  disableDefaultCNI: true
  kubeProxyMode: "ipvs"
