# Kind Cluster Configuration for Local Development
# Local development cluster for testing

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci-cd-pipeline-local
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 7080
        protocol: TCP
      - containerPort: 443
        hostPort: 7443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.28.0
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.4.0.0/16"
  serviceSubnet: "10.5.0.0/16"
  disableDefaultCNI: true
  kubeProxyMode: "ipvs"
