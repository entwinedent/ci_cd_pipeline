# Kind Cluster Configuration for Primary Region Simulation
# Simulates us-east-1 EKS cluster locally

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci-cd-pipeline-primary
nodes:
  - role: control-plane
    image: kindest/node:v1.28.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
  - role: worker
    image: kindest/node:v1.28.0
  - role: worker
    image: kindest/node:v1.28.0
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.0.0.0/16"
  serviceSubnet: "10.1.0.0/16"
  disableDefaultCNI: true
  kubeProxyMode: "ipvs"
