kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci-cd-pipeline
nodes:
  # The control plane node
  - role: control-plane
    image: kindest/node:v1.29.0
    extraPortMappings:
      - containerPort: 8080
        hostPort: 8080
        protocol: TCP
      - containerPort: 8000
        hostPort: 8000
        protocol: TCP
  # Worker nodes
  - role: worker
    image: kindest/node:v1.29.0
  - role: worker
    image: kindest/node:v1.29.0
networking:
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
