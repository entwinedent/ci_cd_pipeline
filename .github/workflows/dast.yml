name: DAST Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  owasp-zap:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Build test images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
          
      - name: Start services for DAST
        run: |
          docker compose up -d
          
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8080/healthz; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:8000/healthz; do sleep 2; done'
          
      - name: Set correct permissions for ZAP workspace
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run ZAP Baseline Scan on API Gateway via Docker
        run: |
          docker run --rm \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8080/healthz \
            -J report_api_gateway.json \
            -r report_api_gateway.html \
            -a || true

      - name: Run ZAP Baseline Scan on Telemetry Service via Docker
        run: |
          docker run --rm \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            --network=host \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:8000/healthz \
            -J report_telemetry.json \
            -r report_telemetry.html \
            -a || true
          
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: zap-reports/
          retention-days: 7
          
      - name: Stop services
        if: always()
        run: |
          docker compose down
