name: DAST Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  owasp-zap:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build test images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
          
      - name: Start services for DAST
        run: |
          docker-compose up -d
          
      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8080/healthz; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:8000/healthz; do sleep 2; done'
          
      - name: Run ZAP Baseline Scan on API Gateway
        uses: zaproxy/action-baseline@0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0a0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      - name: Run ZAP Baseline Scan on Telemetry Service
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:8000'
          rules_file_name: '.zap/rules-telemetry.tsv'
          cmd_options: '-a'
          
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_html.html
            report_json.json
          retention-days: 7
          
      - name: Stop services
        if: always()
        run: |
          docker-compose down
