name: SBOM Generation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  generate-sbom:
    name: Generate SBOM for All Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
        
      - name: Build Go image
        working-directory: services/go-api-gateway
        run: docker build -t go-api-gateway:sbom .
        
      - name: Build Rust image
        working-directory: services/rust-data-store
        run: docker build -t rust-data-store:sbom .
        
      - name: Build Python image
        working-directory: services/python-telemetry
        run: docker build -t python-telemetry:sbom .
      
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Generate SBOM for Go image
        run: syft go-api-gateway:sbom -o spdx-json > sbom-go.json
        
      - name: Generate SBOM for Rust image
        run: syft rust-data-store:sbom -o spdx-json > sbom-rust.json
        
      - name: Generate SBOM for Python image
        run: syft python-telemetry:sbom -o spdx-json > sbom-python.json
        
      - name: Upload SBOMs
        uses: actions/upload-artifact@65462800fd760344b1a7b4102951549b39ef5f55
        with:
          name: sboms
          path: |
            sbom-go.json
            sbom-rust.json
            sbom-python.json
          retention-days: 30
          
      - name: Upload SBOM to GitHub Advanced Security
        uses: advanced-security/upload-sbom@7d1b9e2e7b9e9e9e9e9e9e9e9e9e9e9e9e9e9e9
        with:
          file: sbom-go.json
          
      - name: Upload Rust SBOM
        uses: advanced-security/upload-sbom@v1
        with:
          file: sbom-rust.json
          
      - name: Upload Python SBOM
        uses: advanced-security/upload-sbom@v1
        with:
          file: sbom-python.json
