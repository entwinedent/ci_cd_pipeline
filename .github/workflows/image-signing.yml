name: Container Image Signing with Cosign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  sign-images:
    name: Sign Container Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Go image
        uses: docker/build-push-action@v6
        with:
          context: services/go-api-gateway
          push: true
          tags: ghcr.io/${{ github.repository }}/go-api-gateway:${{ github.sha }},ghcr.io/${{ github.repository }}/go-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push Rust image
        uses: docker/build-push-action@v6
        with:
          context: services/rust-data-store
          push: true
          tags: ghcr.io/${{ github.repository }}/rust-data-store:${{ github.sha }},ghcr.io/${{ github.repository }}/rust-data-store:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push Python image
        uses: docker/build-push-action@v6
        with:
          context: services/python-telemetry
          push: true
          tags: ghcr.io/${{ github.repository }}/python-telemetry:${{ github.sha }},ghcr.io/${{ github.repository }}/python-telemetry:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0
      
      - name: Sign Go image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/go-api-gateway:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/go-api-gateway:latest
      
      - name: Sign Rust image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/rust-data-store:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/rust-data-store:latest
      
      - name: Sign Python image
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/python-telemetry:${{ github.sha }}
          cosign sign --yes ghcr.io/${{ github.repository }}/python-telemetry:latest
      
      - name: Verify Go image signature
        run: |
          cosign verify ghcr.io/${{ github.repository }}/go-api-gateway:${{ github.sha }} \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-signing.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      
      - name: Verify Rust image signature
        run: |
          cosign verify ghcr.io/${{ github.repository }}/rust-data-store:${{ github.sha }} \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-signing.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      
      - name: Verify Python image signature
        run: |
          cosign verify ghcr.io/${{ github.repository }}/python-telemetry:${{ github.sha }} \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/image-signing.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
      
      - name: Attach SBOM to Go image
        run: |
          if [ -f sbom-go.json ]; then
            cosign attach sbom --sbom sbom-go.json ghcr.io/${{ github.repository }}/go-api-gateway:${{ github.sha }} || true
          else
            echo "SBOM file not found, skipping attachment"
          fi
      
      - name: Attach SBOM to Rust image
        run: |
          if [ -f sbom-rust.json ]; then
            cosign attach sbom --sbom sbom-rust.json ghcr.io/${{ github.repository }}/rust-data-store:${{ github.sha }} || true
          else
            echo "SBOM file not found, skipping attachment"
          fi
      
      - name: Attach SBOM to Python image
        run: |
          if [ -f sbom-python.json ]; then
            cosign attach sbom --sbom sbom-python.json ghcr.io/${{ github.repository }}/python-telemetry:${{ github.sha }} || true
          else
            echo "SBOM file not found, skipping attachment"
          fi
