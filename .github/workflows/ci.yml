# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install dependencies
        working-directory: services/go-api-gateway
        run: go mod download

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('services/go-api-gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        
      - name: Run tests
        working-directory: services/go-api-gateway
        run: go test -v ./...
        
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/go-api-gateway
          version: latest
          
      - name: Build
        working-directory: services/go-api-gateway
        run: go build -v ./cmd/main.go

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Run tests
        working-directory: services/rust-data-store
        run: cargo test --verbose
        
      - name: Run clippy
        working-directory: services/rust-data-store
        run: cargo clippy -- -D warnings
        
      - name: Check formatting
        working-directory: services/rust-data-store
        run: cargo fmt -- --check
        
      - name: Build
        working-directory: services/rust-data-store
        run: cargo build --verbose --release

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: services/python-telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8 mypy
          
      - name: Run tests
        working-directory: services/python-telemetry
        run: pytest tests/ -v
        
      - name: Check formatting
        working-directory: services/python-telemetry
        run: black src/
        
      - name: Run linter
        working-directory: services/python-telemetry
        run: flake8 src/ --max-line-length=100
        
      - name: Type check
        working-directory: services/python-telemetry
        run: mypy src/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [go-test, rust-test, python-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Go image
        working-directory: services/go-api-gateway
        run: docker build -t go-api-gateway:test .
        
      - name: Build Rust image
        working-directory: services/rust-data-store
        run: docker build -t rust-data-store:test .
        
      - name: Build Python image
        working-directory: services/python-telemetry
        run: docker build -t python-telemetry:test .

  playwright-tests:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Docker images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
        timeout-minutes: 10

      - name: Start services
        run: |
          docker run -d --name rust-data-store -p 50051:50051 rust-data-store:test
          docker run -d --name python-telemetry -p 8000:8000 python-telemetry:test
          docker run -d --name go-api-gateway -p 8080:8080 --link rust-data-store:rust-data-store -e DATA_STORE_TARGET=rust-data-store:50051 go-api-gateway:test
          echo "Waiting for services to start..."
          sleep 15
          echo "Checking service health..."
          docker ps
          echo "--- Rust Data Store logs ---"
          docker logs rust-data-store || echo "No logs for rust-data-store"
          echo "--- Python Telemetry logs ---"
          docker logs python-telemetry || echo "No logs for python-telemetry"
          echo "--- Go API Gateway logs ---"
          docker logs go-api-gateway || echo "No logs for go-api-gateway"
          echo "--- Testing endpoints ---"
          curl -f http://localhost:8000/healthz || echo "python-telemetry not ready"
          curl -f http://localhost:8080/healthz || echo "go-api-gateway not ready"
        timeout-minutes: 5

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for Go API Gateway..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz | grep -q "200" || [ $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz) -eq 200 ]; then
              echo "Go API Gateway is ready"
              break
            fi
            echo "Attempt $i: Go API Gateway not ready yet"
            sleep 2
          done
          
          echo "Waiting for Python Telemetry..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/healthz | grep -q "200" || [ $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/healthz) -eq 200 ]; then
              echo "Python Telemetry is ready"
              break
            fi
            echo "Attempt $i: Python Telemetry not ready yet"
            sleep 2
          done
          
          echo "Services are ready"
        timeout-minutes: 2

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: |
          chmod +x run-e2e.sh
          ./run-e2e.sh
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  k6-load-tests:
    name: k6 Load Testing
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
        timeout-minutes: 10

      - name: Install k6
        run: |
          wget https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf k6-v0.54.0-linux-amd64.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/
          k6 version

      - name: Start services
        run: |
          docker run -d --name rust-data-store -p 50051:50051 rust-data-store:test
          docker run -d --name python-telemetry -p 8000:8000 python-telemetry:test
          docker run -d --name go-api-gateway -p 8080:8080 --link rust-data-store:rust-data-store -e DATA_STORE_TARGET=rust-data-store:50051 go-api-gateway:test
          echo "Waiting for services to start..."
          sleep 15
          echo "Checking service health..."
          docker ps
          echo "--- Rust Data Store logs ---"
          docker logs rust-data-store || echo "No logs for rust-data-store"
          echo "--- Python Telemetry logs ---"
          docker logs python-telemetry || echo "No logs for python-telemetry"
          echo "--- Go API Gateway logs ---"
          docker logs go-api-gateway || echo "No logs for go-api-gateway"
          echo "--- Testing endpoints ---"
          curl -f http://localhost:8000/healthz || echo "python-telemetry not ready"
          curl -f http://localhost:8080/healthz || echo "go-api-gateway not ready"
        timeout-minutes: 5

      - name: Wait for Services to be Ready
        run: |
          echo "Waiting for Go API Gateway..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/healthz | grep -q "200" || [ $(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/healthz) -eq 200 ]; then
              echo "Go API Gateway is up!"
              exit 0
            fi
            echo "Attempt $i: Gateway not ready yet, sleeping..."
            sleep 2
          done
          echo "Gateway failed to start in time!"
          docker logs go-api-gateway
          exit 1
        
      - name: Run load tests
        run: bash tests/load/run-load.sh
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000

      - name: Run spike test
        run: |
          mkdir -p tests/load/results
          k6 run --summary-export=tests/load/results/spike-summary.json tests/load/scenarios/spike-test.js
        env:
          API_GATEWAY_URL: http://localhost:8080

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: tests/load/results/

  pact-tests:
    name: Pact Contract Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Run Go gateway Pact tests
        working-directory: tests/pact/go-gateway-consumer
        run: |
          chmod +x run-pact.sh
          ./run-pact.sh
        
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install Python webhook Pact dependencies
        working-directory: tests/pact/python-webhook-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Python webhook Pact tests
        working-directory: tests/pact/python-webhook-consumer
        run: pytest consumer_test.py
        
      - name: Upload Pact contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/pact/pacts/
