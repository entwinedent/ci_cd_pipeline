# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install dependencies
        working-directory: services/go-api-gateway
        run: go mod download

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('services/go-api-gateway/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        
      - name: Run tests
        working-directory: services/go-api-gateway
        run: go test -v ./...
        
      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/go-api-gateway
          version: latest
          
      - name: Build
        working-directory: services/go-api-gateway
        run: go build -v ./cmd/main.go

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Run tests
        working-directory: services/rust-data-store
        run: cargo test --verbose
        
      - name: Run clippy
        working-directory: services/rust-data-store
        run: cargo clippy -- -D warnings
        
      - name: Check formatting
        working-directory: services/rust-data-store
        run: cargo fmt -- --check
        
      - name: Build
        working-directory: services/rust-data-store
        run: cargo build --verbose --release

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: services/python-telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8 mypy
          
      - name: Run tests
        working-directory: services/python-telemetry
        run: pytest tests/ -v
        
      - name: Check formatting
        working-directory: services/python-telemetry
        run: black src/
        
      - name: Run linter
        working-directory: services/python-telemetry
        run: flake8 src/ --max-line-length=100
        
      - name: Type check
        working-directory: services/python-telemetry
        run: mypy src/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [go-test, rust-test, python-test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Go image
        working-directory: services/go-api-gateway
        run: docker build -t go-api-gateway:test .
        
      - name: Build Rust image
        working-directory: services/rust-data-store
        run: docker build -t rust-data-store:test .
        
      - name: Build Python image
        working-directory: services/python-telemetry
        run: docker build -t python-telemetry:test .

  playwright-tests:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  k6-load-tests:
    name: k6 Load Testing
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          wget https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          tar -xzf k6-v0.54.0-linux-amd64.tar.gz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/
          k6 version
        
      - name: Run load tests
        run: k6 run tests/load/load-test.js
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000
          
      - name: Run spike test
        run: k6 run tests/load/scenarios/spike-test.js
        env:
          API_GATEWAY_URL: http://localhost:8080
          
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: tests/load/*.json

  pact-tests:
    name: Pact Contract Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          
      - name: Install Go gateway Pact dependencies
        working-directory: tests/pact/go-gateway-consumer
        run: npm install
        
      - name: Run Go gateway Pact tests
        working-directory: tests/pact/go-gateway-consumer
        run: npm test
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Python webhook Pact dependencies
        working-directory: tests/pact/python-webhook-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Python webhook Pact tests
        working-directory: tests/pact/python-webhook-consumer
        run: pytest consumer_test.py
        
      - name: Upload Pact contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pact-contracts
          path: tests/pact/pacts/
