# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Go
        uses: actions/setup-go@0c52d7470c3bc7653bb7179d7ab6a8bb0cc0b2b9
        with:
          go-version: '1.22'
          
      - name: Install dependencies
        working-directory: services/go-api-gateway
        run: go mod download
        
      - name: Run tests
        working-directory: services/go-api-gateway
        run: go test -v ./...
        
      - name: Run linter
        uses: golangci/golangci-lint-action@3a9195e8e6a5e4f3b5a9a5a5a5a5a5a5a5a5a5a5
        with:
          working-directory: services/go-api-gateway
          version: latest
          
      - name: Build
        working-directory: services/go-api-gateway
        run: go build -v ./cmd/main.go

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Rust
        uses: actions-rs/toolchain@16499d5f9a3e0b7faa1ed3c77c3d9b7f3e0b7f7f
        with:
          toolchain: stable
          components: rustfmt, clippy
          
      - name: Run tests
        working-directory: services/rust-data-store
        run: cargo test --verbose
        
      - name: Run clippy
        working-directory: services/rust-data-store
        run: cargo clippy -- -D warnings
        
      - name: Check formatting
        working-directory: services/rust-data-store
        run: cargo fmt -- --check
        
      - name: Build
        working-directory: services/rust-data-store
        run: cargo build --verbose --release

  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Python
        uses: actions/setup-python@0c52d7470c3bc7653bb7179d7ab6a8bb0cc0b2b9
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: services/python-telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest black flake8 mypy
          
      - name: Run tests
        working-directory: services/python-telemetry
        run: pytest src/ -v
        
      - name: Check formatting
        working-directory: services/python-telemetry
        run: black --check src/
        
      - name: Run linter
        working-directory: services/python-telemetry
        run: flake8 src/
        
      - name: Type check
        working-directory: services/python-telemetry
        run: mypy src/

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [go-test, rust-test, python-test]
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226
        
      - name: Build Go image
        working-directory: services/go-api-gateway
        run: docker build -t go-api-gateway:test .
        
      - name: Build Rust image
        working-directory: services/rust-data-store
        run: docker build -t rust-data-store:test .
        
      - name: Build Python image
        working-directory: services/python-telemetry
        run: docker build -t python-telemetry:test .

  playwright-tests:
    name: Playwright E2E & API Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        working-directory: tests/e2e
        run: npm ci
        
      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps
        
      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000
          
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4102951549b39ef5f55
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

  k6-load-tests:
    name: k6 Load Testing
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up k6
        uses: grafana/k6-action@2c9b5f6b2b6b6b6b6b6b6b6b6b6b6b6b6b6b6b6
        
      - name: Run load tests
        run: k6 run tests/load/load-test.js
        env:
          API_GATEWAY_URL: http://localhost:8080
          TELEMETRY_URL: http://localhost:8000
          
      - name: Run spike test
        run: k6 run tests/load/scenarios/spike-test.js
        env:
          API_GATEWAY_URL: http://localhost:8080
          
      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4102951549b39ef5f55
        with:
          name: k6-results
          path: tests/load/*.json

  pact-tests:
    name: Pact Contract Tests
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/checkout@0ad4b8f5a0edc470f0c95d564fd9bf4161a8f958
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Go gateway Pact dependencies
        working-directory: tests/pact/go-gateway-consumer
        run: npm ci
        
      - name: Run Go gateway Pact tests
        working-directory: tests/pact/go-gateway-consumer
        run: npm test
        
      - name: Set up Python
        uses: actions/setup-python@0c52d7470c3bc7653bb7179d7ab6a8bb0cc0b2b9
        with:
          python-version: '3.11'
          
      - name: Install Python webhook Pact dependencies
        working-directory: tests/pact/python-webhook-consumer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Python webhook Pact tests
        working-directory: tests/pact/python-webhook-consumer
        run: pytest consumer_test.py
        
      - name: Upload Pact contracts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4102951549b39ef5f55
        with:
          name: pact-contracts
          path: tests/pact/pacts/
