# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  container-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway || echo "Go build failed, will skip scan"
          docker build -t rust-data-store:test services/rust-data-store || echo "Rust build failed, will skip scan"
          docker build -t python-telemetry:test services/python-telemetry || echo "Python build failed, will skip scan"
        timeout-minutes: 10
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: go-api-gateway:test
          format: 'sarif'
          output: 'trivy-go-results.sarif'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-go-results.sarif'
          category: 'trivy-go'
        continue-on-error: true
          
      - name: Run Trivy on Rust image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rust-data-store:test
          format: 'sarif'
          output: 'trivy-rust-results.sarif'
        continue-on-error: true
        timeout-minutes: 5
          
      - name: Upload Trivy Rust results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-rust-results.sarif'
          
      - name: Run Trivy on Python image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-telemetry:test
          format: 'sarif'
          output: 'trivy-python-results.sarif'
        continue-on-error: true
        timeout-minutes: 5
          
      - name: Upload Trivy Python results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-python-results.sarif'
          category: 'trivy-python'
        continue-on-error: true

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Run Kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: k8s/base
        continue-on-error: true

  snyk-scan:
    name: Snyk Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk to check Go dependencies
        run: |
          cd services/go-api-gateway
          snyk test --severity-threshold=high --detection-depth=3 || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Rust dependencies
        run: |
          cd services/rust-data-store
          snyk test --severity-threshold=high --detection-depth=3 || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Python dependencies
        run: |
          cd services/python-telemetry
          snyk test --severity-threshold=high --detection-depth=3 || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Docker images
        run: |
          snyk test go-api-gateway:test --severity-threshold=high --file=services/go-api-gateway/Dockerfile || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Docker images (Rust)
        run: |
          snyk test rust-data-store:test --severity-threshold=high --file=services/rust-data-store/Dockerfile || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run Snyk to check Docker images (Python)
        run: |
          snyk test python-telemetry:test --severity-threshold=high --file=services/python-telemetry/Dockerfile || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-report.sarif
          retention-days: 30

  zap-scan:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
        timeout-minutes: 10

      - name: Start services
        run: |
          docker run -d --name go-api-gateway -p 8080:8080 go-api-gateway:test
          docker run -d --name rust-data-store -p 50051:50051 rust-data-store:test
          docker run -d --name python-telemetry -p 8000:8000 python-telemetry:test
        timeout-minutes: 5

      - name: Wait for services to be ready
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8080/healthz; do sleep 2; done'
          timeout 60 bash -c 'until curl -s http://localhost:8000/healthz; do sleep 2; done'

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
        continue-on-error: true

      - name: Upload ZAP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: report_html.html
          retention-days: 7
