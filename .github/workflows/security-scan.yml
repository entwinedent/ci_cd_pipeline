# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  container-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build images
        run: |
          docker build -t go-api-gateway:test services/go-api-gateway
          docker build -t rust-data-store:test services/rust-data-store
          docker build -t python-telemetry:test services/python-telemetry
          
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: go-api-gateway:test
          format: 'sarif'
          output: 'trivy-go-results.sarif'
          
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-go-results.sarif'
          
      - name: Run Trivy on Rust image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rust-data-store:test
          format: 'sarif'
          output: 'trivy-rust-results.sarif'
          
      - name: Upload Trivy Rust results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-rust-results.sarif'
          
      - name: Run Trivy on Python image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python-telemetry:test
          format: 'sarif'
          output: 'trivy-python-results.sarif'
          
      - name: Upload Trivy Python results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-python-results.sarif'

  sast-scan:
    name: Static Application Security Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Run Kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: k8s/base
        continue-on-error: true

  snyk-scan:
    name: Snyk Security Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk to check Go dependencies
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test
          working-directory: services/go-api-gateway

      - name: Run Snyk to check Rust dependencies
        run: |
          pip install snyk
          snyk auth $SNYK_TOKEN
          cd services/rust-data-store
          snyk test --severity-threshold=high || true

      - name: Run Snyk to check Python dependencies
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
          command: test
          working-directory: services/python-telemetry

      - name: Run Snyk to check Docker images
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: go-api-gateway:test
          args: --severity-threshold=high --file=services/go-api-gateway/Dockerfile

      - name: Run Snyk to check Docker images (Rust)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: rust-data-store:test
          args: --severity-threshold=high --file=services/rust-data-store/Dockerfile

      - name: Run Snyk to check Docker images (Python)
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: python-telemetry:test
          args: --severity-threshold=high --file=services/python-telemetry/Dockerfile

      - name: Upload Snyk results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-report.sarif
          retention-days: 30
