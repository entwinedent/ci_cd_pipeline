name: Language-Specific Security & Mutation Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  go-vulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Run govulncheck
        working-directory: services/go-api-gateway
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  go-mutation:
    name: Go Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Install go-mutesting
        run: go install github.com/zimmski/go-mutesting/cmd/go-mutesting@latest
        
      - name: Run mutation tests
        working-directory: services/go-api-gateway
        run: |
          go-mutesting ./cmd/... || true
        continue-on-error: true

  rust-audit:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          
      - name: Install cargo-audit
        run: cargo install cargo-audit
        
      - name: Run cargo audit
        working-directory: services/rust-data-store
        run: cargo audit

  rust-mutation:
    name: Rust Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          
      - name: Install cargo-mutants
        run: cargo install cargo-mutants
        
      - name: Run mutation tests
        working-directory: services/rust-data-store
        run: |
          cargo mutants || true
        continue-on-error: true

  python-security:
    name: Python Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: services/python-telemetry
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit
          
      - name: Run safety check
        working-directory: services/python-telemetry
        run: safety check --json || true
        continue-on-error: true
        
      - name: Run bandit security linter
        working-directory: services/python-telemetry
        run: bandit -r src/ || true
        continue-on-error: true
