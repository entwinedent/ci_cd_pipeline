# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Phylum Supply Chain Gate

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phylum-scan:
    name: Phylum Package Analysis
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Install Phylum CLI
        run: |
          curl -sSfL https://sh.phylum.io | sh
          echo "$HOME/.phylum" >> $GITHUB_PATH

      - name: Authenticate with Phylum
        env:
          PHYLUM_API_KEY: ${{ secrets.PHYLUM_API_KEY }}
        run: |
          phylum auth token $PHYLUM_API_KEY

      - name: Scan Go dependencies
        working-directory: services/go-api-gateway
        run: |
          phylum analyze go.sum --json > phylum-go-report.json || true
          phylum analyze go.sum

      - name: Scan Rust dependencies
        working-directory: services/rust-data-store
        run: |
          phylum analyze Cargo.lock --json > phylum-rust-report.json || true
          phylum analyze Cargo.lock

      - name: Scan Python dependencies
        working-directory: services/python-telemetry
        run: |
          pip install pip-audit
          pip-audit --format json --output phylum-python-report.json || true
          phylum analyze requirements.txt --json > phylum-python-phylum-report.json || true
          phylum analyze requirements.txt

      - name: Upload Phylum reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phylum-reports
          path: |
            services/go-api-gateway/phylum-go-report.json
            services/rust-data-store/phylum-rust-report.json
            services/python-telemetry/phylum-python-report.json
            services/python-telemetry/phylum-python-phylum-report.json
          retention-days: 30

      - name: Check risk threshold
        run: |
          echo "Checking Phylum risk scores..."
          # This is a placeholder for actual risk threshold checking
          # In production, you would parse the JSON reports and fail if risks exceed thresholds
          echo "Risk threshold check passed"

  deployment-gate:
    name: Deployment Gate
    runs-on: ubuntu-latest
    needs: phylum-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check deployment eligibility
        run: |
          echo "Deployment gate passed - supply chain verified"
          echo "Proceeding with deployment workflow"
