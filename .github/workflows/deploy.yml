name: Deploy to Registry

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata for Go
        id: meta-go
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/username/ci-cd-pipeline/go-api-gateway
          
      - name: Build and push Go image
        uses: docker/build-push-action@v6
        with:
          context: services/go-api-gateway
          push: true
          tags: ${{ steps.meta-go.outputs.tags }}
          labels: ${{ steps.meta-go.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Extract metadata for Rust
        id: meta-rust
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/username/ci-cd-pipeline/rust-data-store
          
      - name: Build and push Rust image
        uses: docker/build-push-action@v6
        with:
          context: services/rust-data-store
          push: true
          tags: ${{ steps.meta-rust.outputs.tags }}
          labels: ${{ steps.meta-rust.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Extract metadata for Python
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/username/ci-cd-pipeline/python-telemetry
          
      - name: Build and push Python image
        uses: docker/build-push-action@5a1b4b4b4b4b4b4b4b4b4b4b4b4b4b4b4b4
        with:
          context: services/python-telemetry
          push: true
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Install Cosign
        run: |
          curl -sSfL https://raw.githubusercontent.com/sigstore/cosign/main/install.sh | sh -s -- -b /usr/local/bin
          
      - name: Sign Go image with Cosign
        run: |
          cosign sign --yes ghcr.io/username/ci-cd-pipeline/go-api-gateway:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
          
      - name: Sign Rust image with Cosign
        run: |
          cosign sign --yes ghcr.io/username/ci-cd-pipeline/rust-data-store:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
          
      - name: Sign Python image with Cosign
        run: |
          cosign sign --yes ghcr.io/username/ci-cd-pipeline/python-telemetry:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
          
      - name: Verify Go image signature
        run: |
          cosign verify ghcr.io/username/ci-cd-pipeline/go-api-gateway:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
          
      - name: Verify Rust image signature
        run: |
          cosign verify ghcr.io/username/ci-cd-pipeline/rust-data-store:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
          
      - name: Verify Python image signature
        run: |
          cosign verify ghcr.io/username/ci-cd-pipeline/python-telemetry:latest
        env:
          COSIGN_EXPERIMENTAL: "true"
